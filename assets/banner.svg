<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="420" viewBox="0 0 1500 420" role="img" aria-label="Maki">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#070c18"><animate attributeName="stop-color" values="#070c18;#0f1f3d;#16305e;#070c18" dur="7s" repeatCount="indefinite"/></stop>
    <stop offset="50%" stop-color="#16305e"><animate attributeName="stop-color" values="#16305e;#070c18;#0f1f3d;#16305e" dur="7s" repeatCount="indefinite"/></stop>
    <stop offset="100%" stop-color="#0f1f3d"><animate attributeName="stop-color" values="#0f1f3d;#16305e;#070c18;#0f1f3d" dur="7s" repeatCount="indefinite"/></stop>
  </linearGradient>
  <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#5ea9ff" stop-opacity="0"/>
    <stop offset="50%" stop-color="#ffffff" stop-opacity="0.9"/>
    <stop offset="100%" stop-color="#5ea9ff" stop-opacity="0"/>
  </linearGradient>
  <radialGradient id="orb" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#5ea9ff" stop-opacity="0.85"/>
    <stop offset="55%" stop-color="#5ea9ff" stop-opacity="0.22"/>
    <stop offset="100%" stop-color="#5ea9ff" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#5ea9ff" stop-opacity="0"/>
    <stop offset="45%" stop-color="#5ea9ff" stop-opacity="0.32"/>
    <stop offset="55%" stop-color="#5ea9ff" stop-opacity="0.32"/>
    <stop offset="100%" stop-color="#5ea9ff" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#ffffff"><animate attributeName="stop-opacity" values="1;0.5;1" dur="3s" repeatCount="indefinite"/></stop>
    <stop offset="100%" stop-color="#5ea9ff"/>
  </linearGradient>
  <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
    <feGaussianBlur stdDeviation="7" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
</defs>
<style>
  @keyframes fl  { 0%,100%{transform:translateY(0) scale(1)} 50%{transform:translateY(-18px) scale(1.07)} }
  @keyframes fl2 { 0%,100%{transform:translateY(0) scale(1.05)} 50%{transform:translateY(16px) scale(1)} }
  @keyframes ltr { 0%{transform:translateX(-380px)} 100%{transform:translateX(1520px)} }
  @keyframes rtl { 0%{transform:translateX(1520px)} 100%{transform:translateX(-380px)} }
  @keyframes puls{ 0%,100%{opacity:.28} 50%{opacity:.72} }
  @keyframes eq  { 0%,100%{transform:scaleY(0.25)} 50%{transform:scaleY(1)} }
  @keyframes spin{ 0%{transform:rotate(0)} 100%{transform:rotate(360deg)} }
  @keyframes blip{ 0%,100%{opacity:.15} 50%{opacity:1} }
  .o1{animation:fl 5.5s ease-in-out infinite; transform-origin:center}
  .o2{animation:fl2 7s ease-in-out infinite; transform-origin:center}
  .sw1{animation:ltr 6.5s linear infinite}
  .sw2{animation:rtl 9.5s linear infinite}
  .gr{animation:puls 4s ease-in-out infinite}
  .ring{animation:spin 26s linear infinite; transform-origin:1180px 210px}
  .dot{animation:blip 2.2s ease-in-out infinite}
  .b1{animation:eq 1.1s ease-in-out infinite; transform-origin:bottom}
  .b2{animation:eq 1.4s ease-in-out infinite 0.2s; transform-origin:bottom}
  .b3{animation:eq 0.9s ease-in-out infinite 0.35s; transform-origin:bottom}
  .b4{animation:eq 1.6s ease-in-out infinite 0.1s; transform-origin:bottom}
  .b5{animation:eq 1.2s ease-in-out infinite 0.5s; transform-origin:bottom}
</style>
<rect width="1500" height="420" fill="url(#bg)"/>
<g opacity="0.55">
  <polygon points="240,0 380,0 620,420 340,420" fill="url(#beam)"><animate attributeName="opacity" values="0.35;0.75;0.35" dur="8s" repeatCount="indefinite"/></polygon>
  <polygon points="900,0 1010,0 1230,420 1010,420" fill="url(#beam)"><animate attributeName="opacity" values="0.7;0.3;0.7" dur="10s" repeatCount="indefinite"/></polygon>
</g>
<g class="gr" stroke="#5ea9ff" stroke-opacity="0.16" stroke-width="1">
  <path d="M0 84 H1500M0 168 H1500M0 252 H1500M0 336 H1500"/>
  <path d="M188 0 V420M376 0 V420M564 0 V420M752 0 V420M940 0 V420M1128 0 V420M1316 0 V420"/>
</g>
<circle class="o1" cx="1180" cy="210" r="230" fill="url(#orb)"/>
<circle class="o2" cx="200" cy="330" r="180" fill="url(#orb)"/>
<g fill="none"><circle class="ring" cx="1180" cy="210" r="150" stroke="#5ea9ff" stroke-opacity="0.5" stroke-width="1.4" stroke-dasharray="10 16"/></g>
<rect class="sw1" x="0" y="0" width="220" height="420" fill="url(#sweep)" opacity="0.30"/>
<rect class="sw2" x="0" y="0" width="120" height="420" fill="url(#sweep)" opacity="0.20"/>
<g fill="#5ea9ff" opacity="0.85">
  <rect class="b1" x="26" y="300" width="10" height="96" rx="5"/>
  <rect class="b2" x="44" y="300" width="10" height="96" rx="5"/>
  <rect class="b3" x="62" y="300" width="10" height="96" rx="5"/>
  <rect class="b4" x="80" y="300" width="10" height="96" rx="5"/>
  <rect class="b5" x="98" y="300" width="10" height="96" rx="5"/>
</g>
<g stroke="#5ea9ff" stroke-width="2.4" fill="none">
  <path d="M60 60 H120 M60 60 V120"><animate attributeName="opacity" values="0.4;1;0.4" dur="3.2s" repeatCount="indefinite"/></path>
  <path d="M1440 360 H1380 M1440 360 V300"><animate attributeName="opacity" values="1;0.4;1" dur="3.2s" repeatCount="indefinite"/></path>
</g>
<rect x="120" y="140" width="8" height="160" rx="4" fill="url(#bar)"><animate attributeName="height" values="160;178;160" dur="3.4s" repeatCount="indefinite"/></rect>
<text x="164" y="196" font-size="78" filter="url(#glow)" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif">🛡️</text>
<text x="256" y="196" font-size="72" font-weight="800" fill="#ffffff" letter-spacing="-1.6" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif">Maki</text>
<text x="166" y="254" font-size="29" fill="#cfe0fb" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif">Complete admin suite for Telegram groups</text>
<text x="166" y="302" font-size="17" fill="#8aa6d0" letter-spacing="3.6" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif">MODERATION &middot; PROTECTION &middot; REPORTS &middot; 300+ COMMANDS</text>
<circle class="dot" cx="170" cy="342" r="6" fill="#5ea9ff"/>
<text x="190" y="349" font-size="15" fill="#8aa6d0" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif">ONLINE</text>
</svg>
